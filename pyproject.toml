[project]
name = "a-wizard"
version = "0.3.1"
description = "Resume-safe multitrack ASR wizard CLI (MLX + mixdown)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    # numba (via mlx-whisper) requires numpy<2.5 on stable releases
    "numpy>=2.0,<2.5",
]

[project.optional-dependencies]
mlx = [
    "mlx-whisper>=0.4.0",
    # mlx-whisper declares bare `numba`; without a floor, resolution can pick
    # 0.53.x / llvmlite 0.36 which only support Python <3.10
    "numba>=0.61",
]
asr = [
    "faster-whisper>=1.2.1",
]
diar-onnx = [
    "sherpa-onnx>=1.10.0",
]
diar-pyannote = [
    "pyannote.audio>=3.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

[project.scripts]
a-wizard = "a_wizard.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a_wizard"]

[tool.hatch.build.targets.wheel.sources]
"src/a_wizard" = "a_wizard"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: optional tests requiring models/network",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
